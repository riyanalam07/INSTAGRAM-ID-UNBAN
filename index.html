<label for="username">Instagram Username</label>
<input
  type="text"
  id="username"
  name="username"
  placeholder="@yourusername"
  required
>

<label for="email">Contact Email</label>
<input
  type="email"
  id="email"
  name="email"
  placeholder="Enter your email"
  required
>

<label for="appeal">Appeal Details</label>
<textarea
  id="appeal"
  name="appeal"
  placeholder="Explain your account issue"
  required
></textarea>

<p>
  Never share your Instagram password or OTP.
</p>

<a href="https://help.instagram.com/">
  Official Instagram Help Center
</a>
