
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checking Form Details</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 130px 20px 30px;
  background: #f5f5f5;
  font-family: Arial, sans-serif;
  color: #555;
  text-align: center;
}

.container {
  width: 100%;
  max-width: 400px;
}

.logo {
  font-size: 95px;
  margin-bottom: 30px;
}

h1 {
  font-size: 25px;
  font-weight: 600;
}

.spinner {
  width: 45px;
  height: 45px;
  margin: 28px auto;
  border: 4px solid #ddd;
  border-top: 4px solid #c13584;
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

p {
  font-size: 15px;
  line-height: 1.6;
}

a {
  color: #1769aa;
}
</style>
</head>

<body>
<div class="container">

  <div class="logo" aria-hidden="true">📷</div>

  <h1>Verifying details...</h1>

  <div class="spinner"></div>

  <p>Checking your form details...</p>



  <a 
  </a>

</div>
</body>
</html>
